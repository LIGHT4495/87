name: Deploy 증빙사진 도우미 to GitHub Pages

on:
  push:
    branches: [main, master, ccr-5cd97a4e-fuskef]
    paths: ['jeungbing-photo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jeungbing-photo/package-lock.json
      - name: Test
        working-directory: jeungbing-photo
        run: npm ci && npm test
      - name: Stage site
        run: |
          mkdir _site
          cp jeungbing-photo/{index.html,app.js,hwpx.js,style.css} _site/
          cp -r jeungbing-photo/vendor _site/vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
